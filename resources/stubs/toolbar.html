<!-- Doppar Profiler (Shadow DOM isolated) -->
<div id="doppar-profiler" data-request-id="{{ID}}" data-is-redirect="{{IS_REDIRECT}}" data-redirect-url="{{REDIRECT_URL}}" data-redirect-chain="{{REDIRECT_CHAIN}}" data-auth-authenticated="{{AUTH_AUTHENTICATED}}" data-auth-user-name="{{AUTH_USER_NAME}}" data-auth-user-email="{{AUTH_USER_EMAIL}}" data-logs-count="{{LOGS_COUNT}}">
  <template id="dp-template">
    <style>{{CSS}}</style>
    <div class="dp-root">
      <button class="dp-launcher" type="button" aria-label="Toggle Doppar Insight">
        <span class="dp-launcher-mark">
          <img src="{{LOGO}}" alt="Doppar Logo" width="18" height="18">
        </span>
      </button>

      <div class="dp-main">
        <div class="dp-group dp-group-request">
          <span class="dp-val dp-status {{STATUS_CLASS}}">{{STATUS}}</span>
          <span class="dp-val dp-redirect" style="display:none" title="Redirect response">Redirect</span>
          <span class="dp-val dp-method {{METHOD_CLASS}}">{{METHOD}}</span>
          <span class="dp-val dp-route" title="{{PATH}}">{{PATH_DISPLAY}}</span>
          <span class="dp-stat dp-stat-duration" title="Duration">
            <span class="dp-ico dp-ico-performance-filled" aria-hidden="true"></span>
            <span class="dp-val">{{DURATION}} ms</span>
          </span>
        </div>
        <div class="dp-group dp-group-metrics">
          <span class="dp-stat dp-stat-session" title="Session">
            <span class="dp-ico dp-ico-session-filled" aria-hidden="true"></span>
            <span class="dp-val">{{SESSION_COUNT}}</span>
          </span>
          <span class="dp-stat dp-stat-logs" title="Logs">
            <span class="dp-ico dp-ico-logs-filled" aria-hidden="true"></span>
            <span class="dp-val">{{LOGS_COUNT}}</span>
          </span>
          <span class="dp-stat dp-stat-response" title="Response size">
            <span class="dp-ico dp-ico-response-filled" aria-hidden="true"></span>
            <span class="dp-val">{{RESPONSE_SIZE}}</span>
          </span>
          <span class="dp-stat dp-stat-memory" title="Peak memory">
            <span class="dp-ico dp-ico-memory-filled" aria-hidden="true"></span>
            <span class="dp-val">{{MEMORY_PEAK}}</span>
          </span>
          <span class="dp-stat dp-stat-sql" title="Database queries">
            <span class="dp-ico dp-ico-database-filled" aria-hidden="true"></span>
            <span class="dp-val">{{SQL_SUMMARY}}<span class="dp-val-time">/{{SQL_TIME}}ms</span></span>
          </span>
          <span class="dp-stat dp-stat-cache" title="Cache operations">
            <span class="dp-ico dp-ico-cache-filled" aria-hidden="true"></span>
            <span class="dp-val">{{CACHE_SUMMARY}}</span>
          </span>
        </div>
        <button class="dp-btn dp-btn-overview" type="button" aria-label="Overview" onclick="window.DopparProfiler && window.DopparProfiler.toggle()">
          <span class="dp-ico dp-ico-overview-filled" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </template>
  <script>(function(){
    try{
      var host=document.getElementById('doppar-profiler');
      if(!host||host.shadowRoot){return}
      var root=host.attachShadow({mode:'open'});
      var tpl=host.querySelector('#dp-template');
      if(tpl&&tpl.content){ root.appendChild(tpl.content.cloneNode(true)); }
      host.textContent='';
      var chainData = host.dataset.redirectChain;
      if(chainData && chainData !== '[]'){
        var redirectEl=root.querySelector('.dp-redirect');
        if(redirectEl){redirectEl.style.display='';}
      }
      if(host.dataset.isRedirect==='true'){
        var redirectEl=root.querySelector('.dp-redirect');
        if(redirectEl){redirectEl.style.display='';}
      }
      var storageKey='doppar.insight.toolbar.collapsed';
      var rootEl=root.querySelector('.dp-root');
      var launcherEl=root.querySelector('.dp-launcher');
      var setCollapsed=function(collapsed){
        if(!rootEl){return}
        rootEl.classList.toggle('dp-root-collapsed', !!collapsed);
        if(launcherEl){
          launcherEl.setAttribute('aria-label', collapsed ? 'Expand Doppar Insight' : 'Collapse Doppar Insight');
        }
        try{
          window.localStorage.setItem(storageKey, collapsed ? '1' : '0');
        }catch(e){}
      };
      if(launcherEl){
        launcherEl.addEventListener('click', function(){
          setCollapsed(!rootEl.classList.contains('dp-root-collapsed'));
        });
      }
      try{
        if(window.localStorage.getItem(storageKey)==='1'){
          setCollapsed(true);
        }
      }catch(e){}
    }catch(e){}
  })();</script>
</div>
<script>{{JS}}</script>
<!-- /Doppar Profiler -->
